name: Bug report
description: Report a reproducible problem in the Kettle editor extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Editor and version
      placeholder: VS Code 1.95 or Cursor 1.x
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kettle extension and core versions
      placeholder: extension 0.1.0, core commit abc123
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant Kettle Debug output after removing private paths or project data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private Desk content, and personal paths.
          required: true
        - label: This is not a vulnerability report; I will follow SECURITY.md for those.
          required: true
